### Audited against Klippain main (c8b3197) on 21 Sep 2026.
### Only values that differ from the Klippain default for this machine's
### selected hardware. Overrides that merely restated a default were removed
### so future Klippain changes to those values flow through.

[shaketune]

[resonance_tester]
probe_points: 175,175,20

[extruder]
nozzle_diameter: 0.600
control: pid
pid_Kp: 24.396 
pid_Ki: 2.464 
pid_Kd: 60.382
#pid_kp: 23.961
#pid_ki: 2.420
#pid_kd: 59.304

[heater_bed]
control: pid
pid_Kp: 54.901 
pid_Ki: 1.435 
pid_Kd: 524.990
#pid_kp: 38.771
#pid_ki: 1.746
#pid_kd: 215.177
sensor_pin: PF4
sensor_type: EPCOS 100K B57560G104F
#sensor_type: Generic 3950
#sensor_type: NTC 100K MGB18-104F39050L32
#sensor_type: ATC Semitec 104GT-2
#sensor_type: 104NT-4-R025H42G
#sensor_type: Honeywell 100K 135-104LAG-J01
#sensor_type: TDK NTCG104LH104JT1

[temperature_sensor heater_pad]
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: PF3
min_temp: 0
max_temp: 180

#[temperature_sensor bed_pad_2]
#sensor_type: NTC 100K MGB18-104F39050L32
#sensor_pin: CHAMBER_TEMPERATURE
#min_temp: 0
#max_temp: 180

## SGTHRS is calibrated per machine; Klippain ships 255 deliberately.
## diag_pin is NOT overridden — Klippain's ^X_STOP / ^Y_STOP resolve through
## this machine's own board_pins aliases to PG6 / PG9 already.

[stepper_x]
homing_retract_dist: 0
position_max: 349
position_endstop: 349

[tmc2209 stepper_x]
driver_SGTHRS: 145

[stepper_y]
homing_retract_dist: 0

[tmc2209 stepper_y]
driver_SGTHRS: 143

[stepper_z1]
dir_pin: !Z1_DIR

[stepper_z3]
dir_pin: !Z3_DIR

# Ellis Bed Fans. Its [gcode_macro M190] supersedes Klippain's bed_heater_ctrl.cfg
# version by parse order. Harmless while fix_heaters_temperature_settle is False.
[include bedfans.cfg]


[input_shaper]
shaper_type_x: mzv
shaper_freq_x: 58.2
damping_ratio_x: 0.055
shaper_type_y: ei
shaper_freq_y: 48.8
damping_ratio_y: 0.055

#####################################################################
# Input shaper - measured 22/09/26 via Shake&Tune
# Kept here rather than klippain_config/config/software/input_shaper.cfg
# so the values survive a klippain update and get picked up by backup.
#####################################################################
[input_shaper]
shaper_type_x: mzv
shaper_freq_x: 58.2
damping_ratio_x: 0.055
shaper_type_y: ei
shaper_freq_y: 48.8
damping_ratio_y: 0.055

#####################################################################
# CANCEL_PRINT ordering fix
# Klippain calls CLEAR_PAUSE + SDCARD_RESET_FILE before BASE_CANCEL_PRINT,
# which clears sd_paused and closes the file. The base command then fails
# its `is_sd_active() or sd_paused` test, falls through to the else branch,
# and never reaches do_cancel() -> note_cancel(). The job is therefore
# never marked cancelled and the UI keeps offering Resume.
# BASE_CANCEL_PRINT does both jobs itself: do_cancel() then cmd_CLEAR_PAUSE().
# Only `gcode:` is overridden here - rename_existing comes from
# klippain_config/macros/base/cancel_print.cfg via section merge.
#####################################################################
[gcode_macro CANCEL_PRINT]
gcode:
    {% set turn_off_heaters_in_end_print = printer["gcode_macro _USER_VARIABLES"].turn_off_heaters_in_end_print %}
    {% set safe_extruder_temp = printer["gcode_macro _USER_VARIABLES"].safe_extruder_temp|float %}
    {% set light_intensity_end_print = printer["gcode_macro _USER_VARIABLES"].light_intensity_end_print %}
    {% set klippain_mmu_enabled = printer["gcode_macro _USER_VARIABLES"].klippain_mmu_enabled %}
    {% set mmu_unload_on_cancel_print = printer["gcode_macro _USER_VARIABLES"].mmu_unload_on_cancel_print %}
    {% set filter_enabled = printer["gcode_macro _USER_VARIABLES"].filter_enabled %}
    {% set light_enabled = printer["gcode_macro _USER_VARIABLES"].light_enabled %}
    {% set status_leds_control_enabled = printer["gcode_macro _USER_VARIABLES"].status_leds_control_enabled|default(False) %}
    {% set bed_mesh_enabled = printer["gcode_macro _USER_VARIABLES"].bed_mesh_enabled %}
    {% set filament_sensor_enabled = printer["gcode_macro _USER_VARIABLES"].filament_sensor_enabled|default(False) %}
    {% set filter_default_time = printer["gcode_macro _USER_VARIABLES"].filter_default_time_on_end_print|default(600)|int %}
    {% set hotend_fan_tach_enabled = printer["gcode_macro _USER_VARIABLES"].hotend_fan_tach_enabled|default(False) %}
    {% set retract_length = printer["gcode_macro _USER_VARIABLES"].retract_length|default(20)|float %}

    {% if printer.toolhead.homed_axes == "xyz" %}
        PARK
    {% endif %}

    {% if klippain_mmu_enabled and mmu_unload_on_cancel_print %}
        {% if printer.mmu.enabled and printer.mmu.tool|int != -2 %}
            MMU_UNLOAD
        {% endif %}
    {% elif printer.extruder.can_extrude %}
        G92 E0
        G1 E-{retract_length} F2100
    {% endif %}

    {% if turn_off_heaters_in_end_print %}
        TURN_OFF_HEATERS
    {% else %}
        SET_HEATER_TEMPERATURE HEATER=extruder TARGET={safe_extruder_temp}
    {% endif %}

    {% if hotend_fan_tach_enabled %}
        UPDATE_DELAYED_GCODE ID=_BACKGROUND_HOTEND_TACHO_CHECK DURATION=0
    {% endif %}

    M107
    M400

    BASE_CANCEL_PRINT

    {% if bed_mesh_enabled %}
        BED_MESH_CLEAR
    {% endif %}

    {% if filter_enabled %}
        {% if printer['fan_generic filter'].speed > 0 %}
            {% set FILTER_TIME = params.FILTER_TIME|default(filter_default_time)|int %}
            START_FILTER SPEED=1
            UPDATE_DELAYED_GCODE ID=_STOP_FILTER_DELAYED DURATION={FILTER_TIME}
        {% endif %}
    {% endif %}

    {% if light_enabled %}
        LIGHT_ON S={light_intensity_end_print}
    {% endif %}
    {% if status_leds_control_enabled %}
        STATUS_LEDS COLOR="OFF"
    {% endif %}

    {% if klippain_mmu_enabled %}
        {% if printer.mmu.enabled and printer.mmu.print_start_detection|int == 0 %}
            _MMU_PRINT_END STATE=cancelled
        {% endif %}
    {% endif %}

    {% if filament_sensor_enabled %}
        _KLIPPAIN_SET_FILAMENT_SENSORS ENABLE=1
    {% endif %}

    SET_PAUSE_NEXT_LAYER ENABLE=0
    SET_PAUSE_AT_LAYER ENABLE=0 LAYER=0
