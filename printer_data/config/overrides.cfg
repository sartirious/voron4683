### Audited against Klippain main (c8b3197) on 21 Sep 2026.
### Only values that differ from the Klippain default for this machine's
### selected hardware. Overrides that merely restated a default were removed
### so future Klippain changes to those values flow through.

[shaketune]

[extruder]
nozzle_diameter: 0.600
control: pid
pid_Kp: 24.396 
pid_Ki: 2.464 
pid_Kd: 60.382
#pid_kp: 23.961
#pid_ki: 2.420
#pid_kd: 59.304

[heater_bed]
control: pid
pid_Kp: 54.901 
pid_Ki: 1.435 
pid_Kd: 524.990
#pid_kp: 38.771
#pid_ki: 1.746
#pid_kd: 215.177
sensor_pin: PF4
sensor_type: EPCOS 100K B57560G104F
#sensor_type: Generic 3950
#sensor_type: NTC 100K MGB18-104F39050L32
#sensor_type: ATC Semitec 104GT-2
#sensor_type: 104NT-4-R025H42G
#sensor_type: Honeywell 100K 135-104LAG-J01
#sensor_type: TDK NTCG104LH104JT1

[temperature_sensor heater_pad]
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: PF3
min_temp: 0
max_temp: 180

#[temperature_sensor bed_pad_2]
#sensor_type: NTC 100K MGB18-104F39050L32
#sensor_pin: CHAMBER_TEMPERATURE
#min_temp: 0
#max_temp: 180

## SGTHRS is calibrated per machine; Klippain ships 255 deliberately.
## diag_pin is NOT overridden — Klippain's ^X_STOP / ^Y_STOP resolve through
## this machine's own board_pins aliases to PG6 / PG9 already.

[stepper_x]
homing_retract_dist: 0
position_max: 349
position_endstop: 349

[tmc2209 stepper_x]
driver_SGTHRS: 145

[stepper_y]
homing_retract_dist: 0

[tmc2209 stepper_y]
driver_SGTHRS: 143

[stepper_z1]
dir_pin: !Z1_DIR

[stepper_z3]
dir_pin: !Z3_DIR

# Ellis Bed Fans. Its [gcode_macro M190] supersedes Klippain's bed_heater_ctrl.cfg
# version by parse order. Harmless while fix_heaters_temperature_settle is False.
[include bedfans.cfg]

